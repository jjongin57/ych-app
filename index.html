<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF6E5" />
  <title>우리 아이 놀이터</title>
  <!-- 홈 화면에 추가하면 주소창 없이 앱처럼 열림 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="놀이터" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 배경 장식 -->
  <div class="sky" aria-hidden="true">
    <span class="cloud c1">☁️</span>
    <span class="cloud c2">☁️</span>
    <span class="cloud c3">☁️</span>
  </div>

  <!-- 홈 화면 -->
  <main id="home" class="screen">
    <header class="hero">
      <div class="sun" aria-hidden="true">🌞</div>
      <p class="greeting" id="greeting">안녕!</p>
      <h1 class="title">
        <button type="button" id="nameBtn" class="name-btn" aria-label="이름 바꾸기">
          <span id="childName">친구</span>
        </button>야, 오늘은 뭐 하고 놀까?
      </h1>
    </header>

    <nav class="menu" aria-label="놀이 메뉴">
      <a class="card" href="#sea"    style="--c:#80DEEA; --d:0s">
        <span class="icon">🐳</span><span class="label">바다 체험</span>
      </a>
      <a class="card" href="#draw"   style="--c:#FF8A80; --d:.05s">
        <span class="icon">🎨</span><span class="label">그림 그리기</span>
      </a>
      <a class="card" href="#bubble" style="--c:#B39DDB; --d:.1s">
        <span class="icon">🫧</span><span class="label">비눗방울</span>
      </a>
      <a class="card" href="#peek"   style="--c:#A5D6A7; --d:.15s">
        <span class="icon">🙈</span><span class="label">까꿍 놀이</span>
      </a>
    </nav>

    <section class="stickers" aria-label="오늘 모은 스티커">
      <span class="stickers-title">오늘 모은 별</span>
      <span id="stars" class="stars">⭐</span>
    </section>
  </main>

  <!-- 바다 체험 -->
  <section id="seaScreen" class="game-screen sea-screen" hidden>
    <canvas id="seaCanvas" aria-label="바다 체험: 바다 친구를 눌러 보세요"></canvas>
    <div class="game-top">
      <button type="button" class="back hold-back">⬅️ 집으로</button>
      <span class="game-title">🐳 바다 체험</span>
      <button type="button" class="back fs-btn" id="fsBtn" hidden>📺 크게 보기</button>
    </div>
    <p class="sea-hint" id="seaHint">바다 친구를 톡톡 눌러 보세요!</p>
  </section>

  <!-- 그림 그리기 -->
  <section id="drawScreen" class="game-screen draw-screen" hidden>
    <canvas class="draw-canvas" aria-label="그림 그리기 종이"></canvas>
    <div class="tools" aria-label="색깔과 도구"></div>
    <div class="game-top">
      <button type="button" class="back hold-back">⬅️ 집으로</button>
    </div>
  </section>

  <!-- 비눗방울 -->
  <section id="bubbleScreen" class="game-screen" hidden>
    <canvas aria-label="비눗방울: 눌러서 터뜨려 보세요"></canvas>
    <div class="game-top">
      <button type="button" class="back hold-back">⬅️ 집으로</button>
      <span class="game-title">🫧 비눗방울</span>
    </div>
  </section>

  <!-- 까꿍 놀이 -->
  <section id="peekScreen" class="game-screen peek-screen" hidden>
    <div class="peek-grid"></div>
    <div class="game-top">
      <button type="button" class="back hold-back">⬅️ 집으로</button>
      <span class="game-title">🙈 까꿍 놀이</span>
    </div>
  </section>

  <script src="common.js"></script>
  <script src="sea.js"></script>
  <script src="draw.js"></script>
  <script src="bubble.js"></script>
  <script src="peek.js"></script>
  <script src="app.js"></script>
</body>
</html>
